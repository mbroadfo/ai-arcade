pi:
  host: raspberrypi.local
  port: 22
  username: pi
  # Use a private key. Password authentication is intentionally not stored here.
  ssh_key_path: "C:/Users/yourname/.ssh/id_ed25519"
  # Root of the library on the Pi flash drive. Adjust to your actual mount/path.
  remote_root: "/media/pi/roms"

aws:
  profile: default
  region: us-west-2
  bucket: "REPLACE_WITH_STACK_OUTPUT_BUCKET_NAME"
  prefix: "pi-library"

backup:
  # These patterns are matched against POSIX-style paths relative to remote_root.
  exclude:
    - "**/.DS_Store"
    - "**/Thumbs.db"
  # Safe default: S3 objects are never deleted because a source file disappears.
  delete_remote_objects: false
  local_manifest_dir: ".manifests"
  s3_manifest_key: "_manifests/latest.json"
