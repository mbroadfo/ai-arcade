name: Validate CloudFormation

on:
  push:
    paths:
      - 'infra/cloudformation/**'
      - '.github/workflows/cloudformation.yml'
  pull_request:
    paths:
      - 'infra/cloudformation/**'
      - '.github/workflows/cloudformation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic template presence check
        run: test -s infra/cloudformation/backup-bucket.yaml
