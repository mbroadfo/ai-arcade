<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Arcade Observatory</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #141821; --line: #252b38; --text: #e6e9ef; --dim: #8a93a6;
    --accent: #ffd23f; --model: #4cc9f0; --code: #f77f00; --rule: #b388eb; --ok: #57cc99; --bad: #ef476f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: baseline; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .12em; color: var(--accent); }
  header .item { font-family: var(--mono); color: var(--dim); }
  header .item b { color: var(--text); font-weight: 600; }
  #conn { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 5px; }
  .dot.on { background: var(--ok); }
  main { display: grid; grid-template-columns: minmax(260px, 520px) minmax(300px, 1fr); gap: 12px; padding: 12px 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
  #screen { display: flex; justify-content: center; align-items: center; background: #000; border-radius: 6px;
            aspect-ratio: 224 / 288; overflow: hidden; }
  #screen img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  #screen .none { color: var(--dim); font-family: var(--mono); padding: 20px; text-align: center; }
  .side { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-family: var(--mono); }
  .kv .k { color: var(--dim); }
  .goal { font-size: 22px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
  .stance { color: var(--dim); font-family: var(--mono); margin-top: 2px; }
  .bars { display: grid; gap: 4px; margin-top: 8px; font-family: var(--mono); }
  .bar { display: grid; grid-template-columns: 56px 1fr 52px; gap: 8px; align-items: center; }
  .bar .track { height: 12px; background: #0e1118; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--model); }
  .bar.sel .fill { background: var(--accent); }
  .bar.sel span:first-child { color: var(--accent); font-weight: 700; }
  .bar span:last-child { text-align: right; color: var(--dim); }
  .who { margin-top: 8px; font-family: var(--mono); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #0b0d12; }
  .tag.model { background: var(--model); } .tag.rule { background: var(--rule); } .tag.code { background: var(--code); }
  .share { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: #0e1118; margin: 6px 0 8px; }
  .share div { height: 100%; }
  .legend { display: grid; gap: 2px; font-family: var(--mono); font-size: 12px; }
  .legend div { display: flex; justify-content: space-between; gap: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 4px; }
  .pad div { border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center;
             justify-content: center; color: var(--dim); font-size: 16px; }
  .pad .on { background: var(--accent); color: #0b0d12; border-color: var(--accent); }
  .controls { display: flex; gap: 18px; align-items: center; }
  .wide { grid-column: 1 / -1; }
  #timeline { font-family: var(--mono); font-size: 12px; max-height: 300px; overflow-y: auto; }
  #timeline div { display: grid; grid-template-columns: 70px 78px 1fr; gap: 10px; padding: 2px 0;
                  border-bottom: 1px solid #1b202b; }
  #timeline .f { color: var(--dim); text-align: right; }
  #timeline .e { font-weight: 600; text-transform: uppercase; }
  #timeline .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c4c9d4; }
  .e.goal, .e.stance, .e.advice { color: var(--accent); } .e.decision { color: var(--model); }
  .e.move { color: var(--dim); } .e.reflex, .e.reverse, .e.revise { color: var(--code); }
  .e.game_over, .e.late { color: var(--bad); } .e.run { color: var(--ok); }
  .filters { display: flex; gap: 12px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .muted { color: var(--dim); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 12px 16px; } #screen { max-width: 420px; margin: 0 auto; } }
</style>
</head>
<body>
<header>
  <span class="brand">AI ARCADE</span>
  <span class="item" id="h-title"><b>—</b></span>
  <span class="item">GAME <b id="h-game">—</b></span>
  <span class="item">SCORE <b id="h-score">—</b></span>
  <span class="item">LEVEL <b id="h-level">—</b></span>
  <span class="item">LIVES <b id="h-lives">—</b></span>
  <span class="item" id="h-run"></span>
  <span id="conn"><span class="dot" id="d-page"></span>page <span class="dot" id="d-video"></span>video <span id="fps" class="muted"></span></span>
</header>
<main>
  <section class="panel">
    <h2>LIVE GAME</h2>
    <div id="screen"><div class="none" id="novideo">No video yet.<br>Start a game with tools/start_pi_game.py.</div><img id="frame" alt="" hidden></div>
  </section>
  <div class="side">
    <section class="panel">
      <h2>ACTIVE INTENT</h2>
      <div class="goal" id="goal">—</div>
      <div class="stance" id="stance"></div>
    </section>
    <section class="panel">
      <h2>LAST MOVE</h2>
      <div class="kv" id="move-kv"><span class="k">waiting</span><span class="muted">no junction yet</span></div>
      <div class="bars" id="bars"></div>
      <div class="who" id="who"></div>
    </section>
    <section class="panel">
      <h2>WHO MADE THE MOVES (THIS RUN)</h2>
      <div class="share" id="share"></div>
      <div class="legend" id="legend"><span class="muted">no booked moves yet</span></div>
    </section>
    <section class="panel">
      <h2>CURRENT STATE</h2>
      <div class="kv" id="state"><span class="k">—</span><span></span></div>
    </section>
    <section class="panel controls">
      <div><h2>CONTROLS</h2>
        <div class="pad"><div></div><div id="k-UP">▲</div><div></div><div id="k-LEFT">◀</div><div></div><div id="k-RIGHT">▶</div><div></div><div id="k-DOWN">▼</div><div></div></div>
      </div>
      <div class="kv"><span class="k">held</span><span id="held">none</span></div>
    </section>
  </div>
  <section class="panel wide">
    <h2>EVENT TIMELINE</h2>
    <div class="filters">
      <label><input type="checkbox" id="f-move"> moves</label>
      <label><input type="checkbox" id="f-decision"> answers</label>
    </div>
    <div id="timeline"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const BY_COLOR = { "model": "var(--model)", "rule": "var(--rule)", "code-late": "#f77f00", "code-fallback": "#e85d04",
                   "code-override": "#dc2f02", "code-skill": "#ffba08" };
const recentDecisions = [];   // answers, to find the one a move used (same tile and arriving direction)
const filters = { move: false, decision: false };
let moves = {};               // by -> count, rebuilt from status lines (the player's own ledger)
let lastFrame = null;

function tagFor(by) {
  const cls = by === "model" ? "model" : by === "rule" ? "rule" : "code";
  return `<span class="tag ${cls}">${by}</span>`;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

function describe(r) {
  const skip = new Set(["event", "t", "frame"]);
  switch (r.event) {
    case "goal": return `goal → ${r.goal}`;
    case "stance": return `stance ${JSON.stringify(r.mods)}`;
    case "decision": return `${r.direction} at ${r.tile} (${Math.round(100 * r.confidence)}%, ${r.latency_ms} ms, ${r.source})`;
    case "move": return `${r.executed} at ${r.tile} by ${r.by} (${r.via})` + (r.proposed !== r.executed ? `, proposed ${r.proposed}` : "");
    case "run": return `${r.game} decider=${r.decider}${r.model ? " " + r.model : ""} knowledge=${r.knowledge || "-"} goal=${r.goal}`;
    case "game_over": return `game ${r.game} over: score ${r.score}, level ${r.level}`;
  }
  return Object.entries(r).filter(([k]) => !skip.has(k)).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
}

function addTimeline(r) {
  if ((r.event === "move" && !filters.move) || (r.event === "decision" && !filters.decision)) return;
  const row = document.createElement("div");
  row.innerHTML = `<span class="f">${r.frame ?? ""}</span><span class="e ${esc(r.event)}">${esc(r.event)}</span><span class="x" title="${esc(describe(r))}">${esc(describe(r))}</span>`;
  const tl = $("timeline");
  tl.prepend(row);
  while (tl.children.length > 200) tl.lastChild.remove();
}

function showMove(m) {
  const d = [...recentDecisions].reverse().find(x => String(x.tile) === String(m.tile) && x.arriving === m.arriving);
  const kv = [["junction", `${m.tile} arriving ${m.arriving}`], ["goal", m.goal],
              ["proposed", `${m.proposed} (${m.source})`], ["executed", m.executed],
              ["latency", m.latency_ms ? `${m.latency_ms} ms` : "—"], ["answer age", m.age_s != null ? `${m.age_s} s` : "—"]];
  if (m.late) kv.push(["late", m.late]);
  $("move-kv").innerHTML = kv.map(([k, v]) => `<span class="k">${k}</span><span>${esc(v)}</span>`).join("");
  const probs = d && d.direction === m.proposed && d.probabilities ? d.probabilities : null;
  $("bars").innerHTML = probs ? Object.entries(probs).sort((a, b) => b[1] - a[1]).map(([dir, p]) =>
    `<div class="bar${dir === m.executed ? " sel" : ""}"><span>${dir}</span><div class="track"><div class="fill" style="width:${(100 * p).toFixed(1)}%"></div></div><span>${p.toFixed(2)}</span></div>`).join("") : "";
  $("who").innerHTML = `executed by ${tagFor(m.by)} <span class="muted">via ${esc(m.via)}</span>`;
}

function showShare(movesByVia) {
  const by = {};
  for (const [label, n] of Object.entries(movesByVia || {})) { const b = label.split(" (")[0]; by[b] = (by[b] || 0) + n; }
  const total = Object.values(by).reduce((a, b) => a + b, 0);
  if (!total) { $("share").innerHTML = ""; $("legend").innerHTML = '<span class="muted">no booked moves yet</span>'; return; }
  const entries = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $("share").innerHTML = entries.map(([b, n]) => `<div style="width:${100 * n / total}%;background:${BY_COLOR[b] || "#888"}" title="${b} ${n}"></div>`).join("");
  $("legend").innerHTML = Object.entries(movesByVia).sort((a, b) => b[1] - a[1]).map(([label, n]) =>
    `<div><span><span class="dot on" style="background:${BY_COLOR[label.split(" (")[0]] || "#888"}"></span>${esc(label)}</span><span>${n} · ${Math.round(100 * n / total)}%</span></div>`).join("");
}

function onStatus(s) {
  $("h-title").innerHTML = `<b>${esc(s.title || "—")}</b>`;
  $("h-game").textContent = s.game ?? "—";
  $("h-score").textContent = s.score != null ? s.score.toLocaleString() : "—";
  $("h-level").textContent = s.level ?? "—";
  $("h-lives").textContent = s.lives ?? "—";
  $("goal").textContent = s.goal ? s.goal.toUpperCase() : "—";
  $("stance").textContent = s.stance || "";
  $("held").textContent = s.held || "none";
  for (const d of ["UP", "DOWN", "LEFT", "RIGHT"]) $("k-" + d).classList.toggle("on", s.held === d);
  $("state").innerHTML = s.playing && s.lines ? s.lines.map(([k, v]) => `<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join("")
                                               : '<span class="k">not playing</span><span class="muted">attract or coin screen</span>';
  if (s.moves) showShare(s.moves);
}

function onEvent(r) {
  if (r.event === "run") {
    $("timeline").innerHTML = ""; recentDecisions.length = 0;
    $("h-run").innerHTML = `<b>${esc(r.decider)}</b>${r.model ? " " + esc(r.model) : ""} · ${esc(r.knowledge || "-")}`;
  }
  if (r.event === "decision") { recentDecisions.push(r); if (recentDecisions.length > 40) recentDecisions.shift(); }
  if (r.event === "move") showMove(r);
  addTimeline(r);
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => $("d-page").classList.add("on");
  es.onerror = () => $("d-page").classList.remove("on");
  es.addEventListener("event", e => onEvent(JSON.parse(e.data)));
  es.addEventListener("status", e => onStatus(JSON.parse(e.data)));
  es.addEventListener("video", e => {
    const v = JSON.parse(e.data);
    $("d-video").classList.toggle("on", v.connected);
    $("fps").textContent = v.connected && v.fps ? `${v.fps} fps` : "";
  });
  es.addEventListener("frame", e => {
    lastFrame = e.data;
    const img = $("frame");
    img.src = "data:image/png;base64," + e.data;
    img.hidden = false; $("novideo").hidden = true;
  });
}
for (const k of Object.keys(filters)) $("f-" + k).addEventListener("change", e => { filters[k] = e.target.checked; });
connect();
</script>
</body>
</html>
