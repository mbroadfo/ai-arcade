# ai-arcade (tools/install_audio.py): all sound out of the USB audio adapter (KT USB Audio, RCA out to the cabinet's
# amplifier). The card is found by its name ("Audio"), not its number, so HDMI cards coming and going do not move it.
# dmix lets two programs share it (EmulationStation's sounds and a game starting); plug converts rates and formats.

pcm.usbaudio {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:Audio,0"
        rate 48000
        format S16_LE
        channels 2
    }
}

pcm.!default {
    type plug
    slave.pcm "usbaudio"
}

ctl.!default {
    type hw
    card Audio
}
