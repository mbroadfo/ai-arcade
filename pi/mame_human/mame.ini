# Standalone MAME 0.251 for human mode (EmulationStation's "mame-0.251" arcade emulator). AI mode does not read this:
# it runs MAME with its own options (tools/start_pi_game.py). Installed to /opt/retropie/configs/mame-0251/mame.ini.

# Rebuilt sets first (named as 0.251 names them), then the cabinet's arcade folder as it is
rompath                   /home/pi/RetroPie/mame-0251/roms;/home/pi/RetroPie/roms/arcade
samplepath                /home/pi/RetroPie/roms/arcade/samples
artpath                   /home/pi/RetroPie/roms/arcade/artwork

cfg_directory             /opt/retropie/configs/mame-0251/cfg
nvram_directory           /opt/retropie/configs/mame-0251/nvram
input_directory           /opt/retropie/configs/mame-0251/inp
state_directory           /opt/retropie/configs/mame-0251/sta
snapshot_directory        /opt/retropie/configs/mame-0251/snap
diff_directory            /opt/retropie/configs/mame-0251/diff

# The panel's controls (tools/install_controls.py writes panel.cfg from pi/controls/panel.json); AI mode does not read this file
ctrlrpath                 /home/pi/.mame/ctrlr
ctrlr                     panel

video                     accel
window                    0
skip_gameinfo             1
joystick                  1
joystickprovider          sdl
# the spinner and the trackball are mice: MAME's trackball, dial and paddle ports default to Mouse X/Y once this is on
mouse                     1

# MAME's default audio latency (2) plays only silence through the Pi's USB audio adapter; 3 to 5 work
audio_latency             4
